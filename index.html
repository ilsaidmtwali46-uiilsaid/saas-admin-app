<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Suite - لوحة مالك المنظومة</title>
  <style>
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-input: #2a2a2a;
      --text-main: #ffffff;
      --text-sub: #b0b0b0;
      --primary: #007bff;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 10px;
      direction: rtl;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      text-align: center;
    }

    .header-card h1 {
      font-size: 20px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 5px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-blue { background-color: #2196F3; }
    .btn-purple { background-color: #673AB7; }
    .btn-green { background-color: #4CAF50; }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary { background-color: var(--primary); }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
      min-width: 480px;
    }

    th, td {
      padding: 8px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    th {
      color: var(--text-sub);
      background-color: #181818;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-card">
      <h1>لوحة تحكم مالك المنظومة</h1>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn btn-blue" onclick="showSection('clients')">إدارة المشتركين</button>
      <button class="nav-btn btn-purple" onclick="showSection('requests')">طلبات التجديد</button>
      <button class="nav-btn btn-green" onclick="showSection('banner')">الشريط الدعائي</button>
    </div>

    <!-- قسم المشتركين -->
    <div id="sec-clients">
      <div class="card">
        <h2>إضافة عميل جديد</h2>
        <div class="form-group">
          <label>اسم العميل / التجاري:</label>
          <input type="text" id="client-name" placeholder="مثال: سوبرماركت الأمل">
        </div>
        <div class="form-group">
          <label>كود العميل / الجهاز:</label>
          <input type="text" id="client-code" placeholder="مثال: CLI-101">
        </div>
        <div class="form-group">
          <label>مدة الاشتراك الأولى:</label>
          <select id="client-plan">
            <option value="7">تجريبي (7 أيام)</option>
            <option value="30">شهر</option>
            <option value="90">3 أشهر</option>
            <option value="180">6 أشهر</option>
            <option value="365">سنة</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="addClient()">إضافة العميل وتفعيل الاشتراك</button>
      </div>

      <div class="card">
        <h2>سجل العملاء والمشتركين</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>كود العميل</th>
                <th>اسم العميل</th>
                <th>تاريخ الانتهاء</th>
                <th>الحالة</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="clients-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- قسم طلبات التجديد -->
    <div id="sec-requests" style="display: none;">
      <div class="card">
        <h2>طلبات التجديد الواردة</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>العميل</th>
                <th>الباقة</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="requests-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- قسم الشريط الدعائي -->
    <div id="sec-banner" style="display: none;">
      <div class="card">
        <h2>إرسال رسالة دعائية</h2>
        <div class="form-group">
          <label>نص الإعلان:</label>
          <textarea id="banner-text" rows="3" placeholder="اكتب النص هنا..."></textarea>
        </div>
        <div class="form-group">
          <label>التوجيه إلى:</label>
          <select id="banner-target" onchange="toggleClientDropdown()">
            <option value="ALL">جميع العملاء</option>
            <option value="SPECIFIC">عميل محدد</option>
          </select>
        </div>
        <div class="form-group" id="client-select-group" style="display: none;">
          <label>اختر العميل:</label>
          <select id="banner-client-select"></select>
        </div>
        <button type="button" class="btn btn-primary" onclick="sendBannerMessage()">نشر الرسالة الدعائية</button>
      </div>

      <div class="card">
        <h2>الإعلانات النشطة</h2>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>المستهدف</th>
                <th>نص الرسالة</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="banners-list"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="j.js"></script>
</body>
</html>
